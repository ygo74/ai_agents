[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-lab-core"
version = "0.1.0"
description = "Shared foundations of the AI Agent Lab agents"
requires-python = ">=3.12"

# Framework free on purpose: the model-provider choices and Azure credential
# provider are shared by both agents and must not depend on an agentic framework.
#
# This distribution now contains only the Azure credential provider and chat
# provider enums. The runtime owns the shared domain errors they inherit from.
dependencies = [
    "ygo74-agent-runtime-security>=0.1,<0.2",
]

[project.optional-dependencies]
# Serving an agent over HTTP. This distribution no longer contains a serving
# module of its own - the descriptor factory it used to carry now lives in the
# library - so the extra exists to pull the library's own `http` dependencies
# through for an agent that is served rather than run at a console.
http = ["ygo74-agent-runtime-agents[http]>=0.1,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_lab"]
