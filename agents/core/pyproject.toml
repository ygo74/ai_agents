[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-lab-core"
version = "0.1.0"
description = "Shared foundations of the AI Agent Lab agents"
requires-python = ">=3.12"

# Framework free on purpose: the security model, the reasoning port and the
# skill registry must never depend on an agentic framework.
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Serving an agent over HTTP. Only `core.serving.discovery` needs it, and only
# to build the descriptor a runtime advertises; every other module of this
# distribution stays free of any transport.
http = ["ygo74-agent-runtime>=0.0.3,<0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_lab"]
