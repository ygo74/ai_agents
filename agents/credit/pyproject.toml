[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "ai-agent-lab-credit-agent"
version = "0.1.0"
description = "SEC-sourced Corporate Credit Analyst company identification"
requires-python = ">=3.12"
dependencies = [
  "ai-agent-lab-core", "pydantic>=2.7,<3", "httpx>=0.27,<1", "mcp>=1.28.1,<2",
  "ygo74-agent-runtime-agents[configuration,mcp]>=0.9.0,<2",
  "ygo74-agent-runtime-security>=0.9.0,<2",
]
[project.optional-dependencies]
maf = ["ai-agent-lab-maf"]
http = ["ai-agent-lab-maf", "ygo74-agent-runtime-agents[http]>=0.9.0,<2"]
[project.scripts]
credit-agent = "ai_agent_lab.credit.adapters.cli.entrypoint:main"
credit-agent-http = "ai_agent_lab.credit.adapters.http.server:main"
[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_lab"]
