[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-mcp-protocol"
version = "0.1.0"
description = "Wire protocol shared by mail MCP servers and their callers"
requires-python = ">=3.12"

# Deliberately minimal. This package is what a server implementer installs, so
# every dependency added here is a dependency imposed on them.
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# The ready-made tool surface of `mail_mcp.protocol.serving`, for a server that
# wants it. A caller only reads payloads and error codes, and needs none of it.
serving = [
    "mcp>=1.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mail_mcp"]
