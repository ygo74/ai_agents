[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-mcp-protocol"
version = "0.1.0"
description = "Wire protocol shared by wiki MCP servers and their callers"
requires-python = ">=3.12"

# Deliberately minimal. This package is what a server implementer installs, so
# every dependency added here is a dependency imposed on them. In particular it
# must never depend on `ai_agent_lab`: a server does not know what an agent is.
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# The ready-made tool surface of `wiki_mcp.protocol.serving`, for a server that
# wants it. A caller only reads payloads and error codes, and needs none of it.
serving = [
    "mcp>=1.24,<2",
]

# Serving that surface over HTTP. The transport, the authentication chain, the open
# health probe and the OAuth discovery document come from the runtime - the same
# ones the mail server uses, which is what stops the two from growing different
# answers to "who may call me". Stdio needs none of it, which is why it is an extra.
http = [
    "mcp>=1.24,<2",
    "ygo74-agent-runtime-mcp[http]>=0.1,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_mcp"]
