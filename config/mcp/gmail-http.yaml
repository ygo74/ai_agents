# Our own mail MCP server, backed by the Gmail REST API, reached over HTTP.
#
# The same server as config/mcp/gmail-api.yaml, reached differently — and the
# difference is the one that matters for a container deployment.
#
# Over stdio the agent *spawns* the server as a child process, so the two share a
# filesystem and a lifetime. That is right on a workstation and wrong in a
# deployment: the Google token file, the OAuth client and the mailbox credential
# would all have to live inside the agent image.
#
# Over HTTP they are two containers. The Google credential stays on the MCP
# server. OAuth token exchange belongs to the shared runtime, not the Mail agent.
#
# A port is reachable by anything on the network, so OBO must exchange
# the verified caller's access token for a token intended for this MCP
# resource. The server validates that token as a JWT. The Mail Agent never forwards
# the LibreChat token directly.
#
#
# The server refuses to start over HTTP without a way to identify its caller. That
# refusal is deliberate: an unauthenticated port would hand the mailbox to anything
# that can reach it, and the only sign of it would be the absence of a line in a log.
#
# Configure the server environment with MAIL_MCP_AUTH_MODE=jwt,
# MAIL_MCP_OIDC_ISSUER, MAIL_MCP_OIDC_AUDIENCE=mail-mcp, and MAIL_MCP_RESOURCE_URL.
# See doc/users/mail-agent.md for the shared-runtime prerequisite and Keycloak setup.
#
# This authenticates the caller to the MCP server. The current Gmail server still
# holds one Google OAuth credential and serves that mailbox; it does not yet map
# each Keycloak identity to a separate Google account.
#
# Start it with:
#
#   docker run --rm --env-file .env.gmail-mcp -p 9100:9100 \
#     -e GMAIL_OAUTH_CLIENT_ID=... -e GMAIL_OAUTH_CLIENT_SECRET=... \
#     -v /path/to/gmail-token.json:/secrets/gmail-token.json:ro \
#     -e GMAIL_OAUTH_TOKEN_FILE=/secrets/gmail-token.json \
#     ghcr.io/ygo74/mail-mcp-gmail:latest \
#     --transport streamable-http --host 0.0.0.0 --port 9100 \
#     --owner <test-user-Keycloak-sub>
#
# The token file is mounted rather than created: the initial Google consent opens
# a browser and listens on the loopback interface, which a container cannot do.
# Run `mail-mcp-gmail-authorise` once on a workstation. See docs/deployment.md.
server: gmail-http
transport: http
# Local debug endpoint. In containers, change the hostname to mail-mcp-gmail.
url: http://127.0.0.1:9100/mcp
request_timeout_seconds: 30
authentication_mode: oauth_on_behalf_of
# The currently linked runtime accepts only audience/scopes here and still
# requires an injected token source. A runtime with built-in generic exchange
# is required for end-to-end OBO; no Mail-specific source is supplied.
# Add exchange settings only according to that runtime version's YAML schema.
authentication_oauth_on_behalf_of:
  audience: mail-mcp
  scopes: []

# It answers our own tool names with the contract payloads, exactly as it does
# over stdio. Only the transport changed.
dialect: native

# Full coverage, sending included — which the official Google server does not
# offer. Read and drafts need gmail.readonly and gmail.compose; the four label
# operations additionally need gmail.modify.
capabilities:
  - search_mail
  - get_mail
  - get_thread
  - list_labels
  - create_draft
  - send_mail
  - mark_read
  - archive_mail
  - apply_label
  - remove_label
  - create_label
  - delete_label

tools:
  search_mail: search_mail
  get_mail: get_mail
  get_thread: get_thread
  list_labels: list_labels
  create_draft: create_draft
  send_mail: send_mail
  mark_read: mark_read
  archive_mail: archive_mail
  apply_label: apply_label
  remove_label: remove_label
  create_label: create_label
  delete_label: delete_label
