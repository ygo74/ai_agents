# Official Gmail MCP server, hosted by Google.
# https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server
#
# Scopes granted to the OAuth client:
#   https://www.googleapis.com/auth/gmail.readonly
#   https://www.googleapis.com/auth/gmail.compose
server: gmail
transport: http
url: https://gmailmcp.googleapis.com/mcp/v1
request_timeout_seconds: 600
authentication_mode: oauth
authentication_oauth:
  # Replace with the Web application client ID registered in Google Cloud.
  client_id: configure-in-google-cloud
  client_secret: ${MAIL_MCP_OAUTH_CLIENT_SECRET}
  callback_port: 8765
  scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    - https://www.googleapis.com/auth/gmail.compose
  token_file: .secrets/mail-mcp-token.json
  client_name: AI Agent Lab Mail Agent

# This server has its own tool names and its own payloads, so it needs a
# translating client rather than the native one.
dialect: gmail

# What this server can actually serve.
#
# Recorded from the live server with:
#   python -m ai_agent_lab.mail.adapters.cli.discover --server gmail
# The recording is kept in data/mcp-discovery/gmail-tools.json. It exposes 23
# tools, and every one of them returns structured content.
#
# Deliberately absent:
#   send_mail - there is no send tool of any kind. Google's design is that a
#               draft is prepared and the person sends it from Gmail, so the
#               agent never offers to send against this server.
#   delete_label - this server can create a label but not delete one. The
#               agent therefore never offers deletion here, while it does
#               against gmail-api. Nothing in the domain or the skills knows
#               about the difference; the binding carries it.
capabilities:
  - search_mail
  - get_mail
  - get_thread
  - list_labels
  - create_draft
  - create_label
  - mark_read
  - archive_mail
  - apply_label
  - remove_label

# Names this server gives to the tools the Gmail dialect uses.
# One tool, update_message_labels, backs four of our capabilities: read state,
# archiving, and both label operations.
tools:
  search_threads: search_threads
  get_message: get_message
  get_thread: get_thread
  list_labels: list_labels
  create_draft: create_draft
  create_label: create_label
  update_message_labels: update_message_labels
