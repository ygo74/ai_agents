# Correspondence between the logical mail tools used by the skills and the tool
# names exposed by the MCP server actually deployed.
#
# The skills and the agent only ever name the logical tool. Pointing them at a
# different server - Gmail, Exchange, a test double - is a change here, not a
# change in code.
server: mail

tools:
  search_mail: search_mail
  get_mail: get_mail
  get_thread: get_thread
  list_labels: list_labels
  create_draft: create_draft
  send_mail: send_mail
  mark_read: mark_read
  archive_mail: archive_mail
  apply_label: apply_label
  remove_label: remove_label
