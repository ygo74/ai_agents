# Capability delivered to the Mail Agent.
tool_name: draft_mail_reply
implementation: mail.draft_reply

# The model selects tools from this text, so it is part of the contract.
description: >-
  Prepare a reply to a message, or to the most recent message of a conversation, following the
  intent stated by the mailbox owner. Returns the draft and a draft reference. Nothing is sent
  and nothing is stored in the mailbox: the reply exists only in this conversation. To put it
  in the mailbox drafts folder, where the owner can find it, call create_draft with the
  reference afterwards.

# Security posture. The risk floor enforced in code cannot be lowered here.
operation:
  type: READ
  risk: LOW
  permission: mail:draft
  confirmation_required: false

# Logical MCP tools this capability is allowed to use.
mcp_tools:
  - get_mail
  - get_thread
