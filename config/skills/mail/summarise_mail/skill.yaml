# Capability delivered to the Mail Agent.
tool_name: summarise_mail
implementation: mail.summarise

# The model selects tools from this text, so it is part of the contract.
description: >-
  Summarise a message or a whole conversation. Returns the summary, the key points, the
  decisions, the actions expected from the owner, the deadlines, the participants, the open
  questions and the source message identifiers. Has no side effect.

# Security posture. The risk floor enforced in code cannot be lowered here.
operation:
  type: READ
  risk: LOW
  permission: mail:read
  confirmation_required: false

# Logical MCP tools this capability is allowed to use.
mcp_tools:
  - get_mail
  - get_thread
