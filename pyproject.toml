# Configuration of the repository tooling. Deliberately not a distribution.
#
# The code lives in six distributions under `agents/` and `mcp-servers/`, each
# with its own pyproject. This file only carries the settings that must be the
# same everywhere: the linter, the type checker and the test runner.
#
# Install everything for development with:
#   python -m scripts.install
# or see docs/repository-structure.md.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "scenario: reproducible agent scenario test",
    "security: security-focused test",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [
    "agents/core/src",
    "agents/maf/src",
    "agents/mail/src",
    "mcp-servers/protocol/src",
    "mcp-servers/gmail/src",
    "mcp-servers/reference/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # early return
    "ARG",       # unused arguments
    "PTH",       # pathlib
    "TID",       # tidy imports
    "C90",       # mccabe complexity
    "ANN",       # type annotations
    "S",         # bandit security
    "BLE",       # blind except
    "TRY",       # exception handling
    "RUF",
]
ignore = [
    "ANN401",  # justified `Any` is reviewed case by case
    "TRY003",  # explicit messages in raise are readable
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixtures with implicit types and reach into framework
# internals to build doubles; strict production rules would add noise there.
"tests/**" = ["S101", "ANN", "ARG", "SLF001", "PLC2701", "TRY"]
# A tool surface is a long declarative list of registrations, not branching
# logic, and its arguments are named by the protocol rather than used directly.
"mcp-servers/protocol/src/mail_mcp/protocol/serving.py" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "agents/core/src",
    "agents/maf/src",
    "agents/mail/src",
    "mcp-servers/protocol/src",
    "mcp-servers/gmail/src",
    "mcp-servers/reference/src",
]
packages = [
    "ai_agent_lab.core",
    "ai_agent_lab.maf",
    "ai_agent_lab.mail",
    "mail_mcp.protocol",
    "mail_mcp.gmail",
    "mail_mcp.reference",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# `ygo74-agent-runtime` ships no `py.typed` marker yet, so mypy cannot read its
# annotations even though the source is fully typed. Adding the marker upstream
# is tracked; until then this is the narrowest possible waiver, and it applies to
# the serving library alone rather than relaxing the strict settings above.
[[tool.mypy.overrides]]
module = "ygo74.*"
ignore_missing_imports = true
