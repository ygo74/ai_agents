# Configuration of the repository tooling. Deliberately not a distribution.
#
# The code lives in ten distributions under `agents/` and `mcp-servers/`, each
# with its own pyproject. This file only carries the settings that must be the
# same everywhere: the linter, the type checker and the test runner.
#
# Install everything for development with:
#   python -m scripts.install
# or see docs/repository-structure.md.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "scenario: reproducible agent scenario test",
    "security: security-focused test",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [
    "agents/core/src",
    "agents/langgraph/src",
    "agents/maf/src",
    "agents/mail/src",
    "agents/wiki/src",
    "mcp-servers/protocol/src",
    "mcp-servers/gmail/src",
    "mcp-servers/reference/src",
    "mcp-servers/wiki-protocol/src",
    "mcp-servers/wiki-reference/src",
    "tests",
]

# `agents/langgraph/src` makes isort read the top-level name `langgraph` as
# first-party, and it would then sort the real framework in with our own
# packages. The adapter distribution is `ai_agent_lab.langgraph`; the bare name
# always means the third-party library.
[tool.ruff.lint.isort]
known-third-party = ["langgraph"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # early return
    "ARG",       # unused arguments
    "PTH",       # pathlib
    "TID",       # tidy imports
    "C90",       # mccabe complexity
    "ANN",       # type annotations
    "S",         # bandit security
    "BLE",       # blind except
    "TRY",       # exception handling
    "RUF",
]
ignore = [
    "ANN401",  # justified `Any` is reviewed case by case
    "TRY003",  # explicit messages in raise are readable
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixtures with implicit types and reach into framework
# internals to build doubles; strict production rules would add noise there.
"tests/**" = ["S101", "ANN", "ARG", "SLF001", "PLC2701", "TRY"]
# A tool surface is a long declarative list of registrations, not branching
# logic, and its arguments are named by the protocol rather than used directly.
"mcp-servers/protocol/src/mail_mcp/protocol/serving.py" = ["ARG001"]
"mcp-servers/wiki-protocol/src/wiki_mcp/protocol/serving.py" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "agents/core/src",
    "agents/langgraph/src",
    "agents/maf/src",
    "agents/mail/src",
    "agents/wiki/src",
    "mcp-servers/protocol/src",
    "mcp-servers/gmail/src",
    "mcp-servers/reference/src",
    "mcp-servers/wiki-protocol/src",
    "mcp-servers/wiki-reference/src",
]
packages = [
    "ai_agent_lab.core",
    "ai_agent_lab.langgraph",
    "ai_agent_lab.maf",
    "ai_agent_lab.mail",
    "ai_agent_lab.wiki",
    "mail_mcp.protocol",
    "mail_mcp.gmail",
    "mail_mcp.reference",
    "wiki_mcp.protocol",
    "wiki_mcp.reference",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# `ygo74-agent-runtime` ships `py.typed` since 0.0.4, so mypy reads its
# annotations directly. The waiver that used to sit here - `ignore_missing_imports`
# for the whole `ygo74.*` namespace - turned every type it exposes into `Any`,
# which silently weakened this repository's strict settings at exactly the
# boundary that now carries the security model.
